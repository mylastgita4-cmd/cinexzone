export const HTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineX Zone</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --accent:#e50914; --text:#e6edf3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
  header { padding:20px; text-align:center; background:var(--card); }
  header h1 { color:var(--accent); margin-bottom:12px; }
  #search { width:min(600px,90%); padding:12px 18px; border-radius:24px;
    border:1px solid #30363d; background:#0d1117; color:var(--text); font-size:16px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:16px; padding:24px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer;
    transition:transform .2s; }
  .card:hover { transform:scale(1.03); }
  .card img { width:100%; aspect-ratio:2/3; object-fit:cover; background:#30363d; }
  .card .info { padding:10px; }
  .card .title { font-size:14px; font-weight:bold; margin-bottom:4px; }
  .card .meta { font-size:12px; color:#8b949e; }
  .rating { color:#f5c518; }
  dialog { background:var(--card); color:var(--text); border:1px solid #30363d;
    border-radius:12px; max-width:600px; width:90%; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  .torrent-row { padding:10px 0; border-bottom:1px solid #30363d; font-size:13px; }
  .torrent-row a { color:#58a6ff; text-decoration:none; font-weight:bold; }
  .muted { color:#8b949e; }
  #status { text-align:center; padding:20px; color:#8b949e; }
</style>
</head>
<body>
<header>
  <h1>CineX Zone</h1>
  <input id="search" type="search" placeholder="Search movies & TV shows..." autofocus>
</header>
<div id="status">Search to discover movies and shows.</div>
<div id="grid"></div>

<dialog id="torrentDialog">
  <h2 id="dTitle" style="color:var(--accent);margin-bottom:10px;"></h2>
  <div id="dBody">Loading torrents...</div>
  <button onclick="document.getElementById('torrentDialog').close()"
    style="margin-top:14px;padding:8px 16px;border-radius:6px;border:none;
    background:var(--accent);color:#fff;cursor:pointer;">Close</button>
</dialog>

<script>
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const dialog = document.getElementById('torrentDialog');
let timer;

document.getElementById('search').addEventListener('input', e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 2) return;
  timer = setTimeout(() => doSearch(q), 500);
});

async function doSearch(q) {
  status.textContent = 'Searching...';
  grid.innerHTML = '';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!data.results || !data.results.length) {
      status.textContent = 'No results found.'; return;
    }
    status.textContent = '';
    for (const r of data.results) {
      if (r.media_type !== 'movie' && r.media_type !== 'tv') continue;
      const card = document.createElement('div');
      card.className = 'card';
      const poster = r.poster_path
        ? 'https://image.tmdb.org/t/p/w342' + r.poster_path
        : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="342" height="513"><rect width="100%" height="100%" fill="%2330363d"/></svg>';
      card.innerHTML =
        '<img loading="lazy" src="' + poster + '">' +
        '<div class="info"><div class="title">' + esc(r.title || r.name) + '</div>' +
        '<div class="meta"><span class="rating">★ ' + (r.vote_average || 'N/A').toFixed ? (r.vote_average||0).toFixed(1) : 'N/A' +
        ' · ' + ((r.release_date || r.first_air_date || '').slice(0,4) || 'N/A') +
        ' · ' + (r.media_type === 'movie' ? 'Movie' : 'TV') + '</div></div>';
      card.addEventListener('click', () => openTorrents(r.title || r.name, (r.release_date || r.first_air_date || '').slice(0,4)));
      grid.appendChild(card);
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
}

async function openTorrents(title, year) {
  document.getElementById('dTitle').textContent = title;
  document.getElementById('dBody').innerHTML = 'Loading torrents...';
  dialog.showModal();
  try {
    const q = year ? title + ' ' + year : title;
    const res = await fetch('/api/torrents?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!data.results || !data.results.length) {
      document.getElementById('dBody').innerHTML =
        '<p class="muted">No torrents found for this title.</p>';
      return;
    }
    document.getElementById('dBody').innerHTML = data.results.map(t =>
      '<div class="torrent-row"><a href="' + t.magnet + '">⬇ ' + esc(t.title) + '</a><br>' +
      '<span class="muted">Size: ' + (t.size||'N/A') + ' · Seeds: ' + (t.seeds||0) +
      ' · Peers: ' + (t.peers||0) + '</span></div>'
    ).join('');
  } catch (err) {
    document.getElementById('dBody').innerHTML = '<p class="muted">Error: ' + esc(err.message) + '</p>';
  }
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>`;
